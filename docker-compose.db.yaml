services:
  db:
    image: postgres:18-alpine
    container_name: postgres_db
    restart: always
    shm_size: 128mb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - pgdata18:/var/lib/postgresql

volumes:
  pgdata18:
